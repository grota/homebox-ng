# Tag → tested → published. See
# `docs/superpowers/specs/2026-09-16-docker-packaging-design.md`.
#
# The tests run *here*, in the job that publishes, rather than checking that `main`
# was green. That inverts the property that matters: it stops mattering when the
# tag is pushed or what colour `main` was, because a red commit cannot produce an
# image. A pre-push hook was considered and rejected — it lives in `.git/hooks`
# (uncommitted, gone on re-clone), `--no-verify` walks past it, and "the latest
# run" has to mean *that commit's* run, which a two-commit push silently gets
# wrong.
#
# The only manual step is the tag itself:  git tag v1.0.0 && git push --tags

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm i -g "$(node -p 'require("./package.json").packageManager')"

      - name: Install
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # The gate. Same command as ci.yml, deliberately: one definition of "passing".
      - name: Test
        run: pnpm -r test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `APP_VERSION` is the tag, and it reaches two places: the SPA at compile
      # time (through `VITE_APP_VERSION`) and the running API (through `/health`).
      # One source, so there is nothing to keep in sync — `package.json` still says
      # 0.0.0 and is read by nothing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          # Without this every release re-downloads the whole pnpm store inside the
          # build's `--mount=type=cache`, which no layer cache can cover.
          cache-from: type=gha
          cache-to: type=gha,mode=max
